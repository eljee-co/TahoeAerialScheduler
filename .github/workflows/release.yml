name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release; leave blank to use VERSION on main"
        required: false

permissions:
  contents: read

concurrency:
  group: tahoe-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve and validate the version
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v${VERSION}"
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            [[ "${GITHUB_REF_NAME}" == "${TAG}" ]]
          fi
          if [[ -n "${REQUESTED_TAG}" ]]; then
            [[ "${REQUESTED_TAG}" == "${TAG}" ]]
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            [[ "$(git rev-parse "${TAG}^{commit}")" == "$(git rev-parse HEAD)" ]] || {
              echo "${TAG} belongs to another commit; bump VERSION instead of replacing it." >&2
              exit 1
            }
          fi
          if gh release view "${TAG}" --json isDraft > /tmp/tahoe-existing-release.json 2>/tmp/tahoe-release-error; then
            python3 -c 'import json; assert not json.load(open("/tmp/tahoe-existing-release.json"))["isDraft"], "Inspect the existing draft release before retrying."'
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "${TAG} is already published; keeping its files unchanged."
          else
            if ! grep -qi 'not found' /tmp/tahoe-release-error; then
              cat /tmp/tahoe-release-error >&2
              exit 1
            fi
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.release.outputs.publish == 'true'
        with:
          python-version: "3.11"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.release.outputs.publish == 'true'
        with:
          node-version: "22"

      - name: Run the full verification and build
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: ./scripts/verify.sh "${RELEASE_TAG}"

      - name: Extract reviewed release notes
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ["RELEASE_TAG"][1:]
          changelog = Path("CHANGELOG.md").read_text()
          match = re.search(r"^## \[" + re.escape(version) + r"\].*\n(.*?)(?=^## |\Z)", changelog, re.M | re.S)
          assert match and match.group(1).strip(), "Add release notes to CHANGELOG.md before publishing."
          notes = match.group(1).strip()
          notes += "\n\nThe installer is per-user and unsigned. If macOS blocks it, use right-click > Open. Native Aerial changes may briefly flash a fallback background. SHA-256 checksums and the source commit are attached.\n"
          Path("dist/release-notes.md").write_text(notes)
          PY

      - name: Save the tested artifact and evidence
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.release.outputs.tag }}-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/*.build.json
            dist/verification.json
          retention-days: 30

      - name: Publish the tested patch release
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          COMMIT="$(git rev-parse HEAD)"
          gh release create "${RELEASE_TAG}" \
            "dist/TahoeAerialScheduler-${RELEASE_TAG}.dmg" \
            "dist/TahoeAerialScheduler-${RELEASE_TAG}.dmg.sha256" \
            "dist/TahoeAerialScheduler-${RELEASE_TAG}.build.json" \
            "dist/verification.json" \
            --target "${COMMIT}" --title "${RELEASE_TAG}" \
            --notes-file dist/release-notes.md --draft
          gh release edit "${RELEASE_TAG}" --draft=false --latest
